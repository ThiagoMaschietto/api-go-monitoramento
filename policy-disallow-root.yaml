apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
spec:
  validationFailureAction: Enforce  # Bloqueia a criação se a regra for violada (Audit apenas audita, Enforce bloqueia)
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
                  kinds:
                    - Pod
      validate:
        message: "Cibersegurança: Os contentores do portfólio não podem ser executados com utilizador root!"
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true